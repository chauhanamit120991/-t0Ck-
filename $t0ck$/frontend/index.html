<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CapitalIntel // Financial Intelligence Dashboard</title>
  <meta name="description" content="Local real-time financial signals, price trends, news aggregation, and automated Gemini AI sentiment analysis.">
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- Local Stylesheet -->
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="root"></div>

  <!-- React Core (v18.3.1) with SRI -->
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" 
    integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  </script>

  <!-- React DOM (v18.3.1) with SRI -->
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" 
    integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  </script>

  <!-- Babel Standalone (v7.26.2) with SRI for in-browser JSX compilation -->
  <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js" 
    integrity="sha384-RgwZ6hj+t5cUuE1+O8VrbNENCeVFTIjTroWdTHusMbpfssSx1gxln5reSjtRkxWs" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
  </script>

  <!-- TradingView Lightweight Charts (v4.1.1) -->
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

  <!-- Application Entry Script (transpiled on the fly by Babel) -->
  <script type="text/babel" src="app.js"></script>

</html>
