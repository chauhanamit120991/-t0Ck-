services:
  - type: web
    name: stocks-dashboard
    env: python
    buildCommand: pip install -r '$t0ck$/backend/requirements.txt'
    startCommand: cd '$t0ck$/backend' && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.6
